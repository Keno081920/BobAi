

<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BobLernt.de – Gemeinsam schlauer!</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f5f6ff;color:#20213b}

header{background:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px #ddd}

.logo{font-size:25px;font-weight:bold;color:#6255df}

.hero{text-align:center;padding:55px 18px;background:linear-gradient(135deg,#e7e5ff,#e4f4ff)}

.hero h1{font-size:38px;margin:12px}

.hero span{color:#6255df}

button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-weight:bold}

.primary{background:#6255df;color:white}

section{max-width:850px;margin:25px auto;padding:22px;background:white;border-radius:18px;box-shadow:0 3px 15px #e4e4ef}

h2{margin-top:0}

.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.subject{background:#f0efff;color:#5145c5}

.subject:hover{background:#dedaff}

#messages{height:280px;overflow:auto;background:#f8f8ff;padding:12px;border-radius:12px;margin:15px 0}

.msg{padding:12px;margin:9px 0;border-radius:12px;max-width:90%;white-space:pre-wrap;line-height:1.5}

.bot{background:#e9e7ff}

.user{background:#6255df;color:white;margin-left:auto}

form{display:flex;gap:8px}

input{flex:1;min-width:0;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:15px}

.quiz{background:#f5f3ff;padding:15px;border-radius:12px;margin-top:12px}

.quiz button{margin:5px;background:#e5e2ff;color:#4436b5}

footer{text-align:center;padding:25px;color:#888}

@media(max-width:500px){.subjects{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}section{margin:15px}}

</style>

</head>

<body>

<header>

<div class="logo">🚀 BobLernt.de</div>

<strong>Deine Lernplattform</strong>

</header>

<div class="hero">

<h1>Hallo! Willkommen bei <span>BobLernt!</span></h1>

<p>Gemeinsam lernen. Gemeinsam schlauer werden.</p>

<p>🤖 Dein persönlicher Lernassistent wartet auf dich!</p>
